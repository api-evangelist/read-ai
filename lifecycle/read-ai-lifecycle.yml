known_limitations_at_beta:
  - OAuth 2.1 flow requires browser login; no machine-to-machine credentials.
  - Access tokens expire after 10 minutes; refresh tokens are single-use and rotate.
  - 100 requests per minute per user.
  - >-
    Ask Read, Coaching and several web-app integration features are not exposed via
    API or MCP; audio/video upload for transcription is not supported via API.
  - Live transcript is off by default unless the live dashboard is opened.
  - Reported interoperability issues with some MCP clients (VS Code, Notion).
