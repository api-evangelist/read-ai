    - {class_uid: 6001, class_name: Web Resources Activity}
    - {class_uid: 6002, class_name: Application Lifecycle}
  source: https://support.read.ai/hc/en-us/articles/50196944604563-Workspace-Audit-Logs-Event-Types-and-Schema
