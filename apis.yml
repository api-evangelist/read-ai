      Method + path, query parameters, request examples, response examples,
      pagination contract and an error-code table for GET /v1/meetings,
      GET /v1/meetings/{id} and GET /v1/meetings/{id}/live.
    endpoint_check: 'GET https://api.read.ai/v1/meetings -> 401 {"detail":"Not authenticated"}'
    openapi: >-
      None published. /openapi.json, /docs and /redoc are 301-redirected by the ALB to
      https://www.read.ai/; /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs
      return {"detail":"Not Found"}.
- name: Read AI MCP Server
  description: >-
    First-party remote Model Context Protocol server exposing a user's Read AI
    meeting reports to any MCP client over Streamable HTTP. Two published tools —
    list_meetings and get_meeting_by_id — return meeting metadata, participants,
    summaries, chapter summaries, action items, key questions, topics, full
    transcripts, metrics and a recording download URL. Listed in the Anthropic
    connector directory and the ChatGPT app directory; protected by OAuth 2.1 with
    RFC 9728 protected-resource metadata and the mcp:execute and meeting:read scopes.
  humanURL: https://support.read.ai/hc/en-us/articles/49381158409491-MCP-Server
  baseURL: https://api.read.ai/mcp
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
