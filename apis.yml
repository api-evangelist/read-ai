apis:
- name: Read AI REST API
  description: >-
    Open-beta public REST API for programmatic access to a user's Read AI meeting
    data. Three documented meeting endpoints — list meetings with cursor pagination
    and epoch-millisecond time filters, retrieve a meeting by ULID, and retrieve
    live data for an in-progress meeting — plus an expand[] projection covering
    summary, chapter_summaries, action_items, key_questions, topics, transcript,
    metrics and recording_download. Read-only; every documented operation is a GET.
    Bearer-token authenticated via OAuth 2.1 with dynamic client registration.
  humanURL: https://support.read.ai/hc/en-us/articles/49381161088659-API-Reference
  baseURL: https://api.read.ai/
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  tags:
