aid: read-ai
name: Read AI
description: >-
  Read AI is an AI-powered meeting intelligence platform that joins Zoom, Microsoft
  Teams and Google Meet calls as an authorized notetaker and turns them into
  structured meeting reports — summaries, chapter summaries, action items, key
  questions, topics, full speaker-attributed transcripts and engagement metrics —
  plus enterprise search across email, messaging and calendar. Founded in 2021 in
  Seattle by the team behind Placed and Foursquare, it reports more than five million
  monthly active users. For developers, Read AI ships an open-beta public REST API at
  api.read.ai (v1 meetings, live meetings, cursor pagination, expandable fields), a
  remote Model Context Protocol server at api.read.ai/mcp listed in the Anthropic and
  ChatGPT connector directories, HMAC-signed user and workspace webhooks, three
  provider-authored downloadable Agent Skills, and an OAuth 2.1 authorization server
  with dynamic client registration. It publishes no OpenAPI.
